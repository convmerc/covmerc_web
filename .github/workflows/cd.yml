name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Authenticate to Google Cloud
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (dev preview channel)
        if: >-
          secrets.FIREBASE_SERVICE_ACCOUNT != '' &&
          github.event.workflow_run.head_branch == 'dev'
        run: |
          npx --yes firebase-tools@14.9.0 hosting:channel:deploy "dev-${{ github.event.workflow_run.head_sha }}" \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --expires 30d \
            --only hosting

      - name: Deploy to Firebase Hosting (production)
        if: >-
          secrets.FIREBASE_SERVICE_ACCOUNT != '' &&
          github.event.workflow_run.head_branch == 'main'
        run: |
          npx --yes firebase-tools@14.9.0 deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only hosting

      - name: CD skipped (configure deployment secrets)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning::CD skipped. Add repository secrets to enable deploys:"
          echo "  - FIREBASE_SERVICE_ACCOUNT (JSON service account)"
          echo "  - NEXT_PUBLIC_FIREBASE_* (same values as .env.local)"
          echo "And repository variable:"
          echo "  - FIREBASE_PROJECT_ID (e.g. convmerc-baeef)"
          echo "  - NEXT_PUBLIC_SITE_URL (optional)"
