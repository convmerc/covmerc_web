name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
      - main
      - phase-e

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production env for Firebase build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_CALLBACK_URL: ${{ vars.PAYSTACK_CALLBACK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ORDER_EMAIL_FROM: ${{ vars.ORDER_EMAIL_FROM }}
          ORDER_NOTIFICATIONS_TO: ${{ vars.ORDER_NOTIFICATIONS_TO }}
        run: bash scripts/write-deploy-env.sh

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ] || [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "::warning::CD skipped. Configure repository secrets and variables:"
            echo "  Secret: FIREBASE_SERVICE_ACCOUNT (JSON service account)"
            echo "  Secret: NEXT_PUBLIC_FIREBASE_* (same values as .env.local)"
            echo "  Variable: FIREBASE_PROJECT_ID (e.g. convmerc-baeef)"
            echo "  Variable: NEXT_PUBLIC_SITE_URL (e.g. https://convmerc-baeef.web.app)"
            exit 0
          fi

          echo "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"

          if [ "${HEAD_BRANCH}" = "dev" ] || [ "${HEAD_BRANCH}" = "phase-e" ]; then
            npx firebase hosting:channel:deploy "preview-${HEAD_SHA}" \
              --project "${FIREBASE_PROJECT_ID}" \
              --expires 30d \
              --only hosting
          elif [ "${HEAD_BRANCH}" = "main" ]; then
            npx firebase deploy \
              --project "${FIREBASE_PROJECT_ID}" \
              --only hosting
          else
            echo "Skipping deploy for branch: ${HEAD_BRANCH}"
          fi
